name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04  # old glibc → AppImage runs on most distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libfuse2 desktop-file-utils
      - name: Build AppImage
        run: bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/release/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        shell: bash
        run: |
          pip install "PySide6>=6.6" pyinstaller pytest
          QT_QPA_PLATFORM=offscreen python -m pytest -q -p no:cacheprovider tests
          pyinstaller --noconfirm --clean dxclusterclient.spec
          VERSION=$(python -c "import dxclient; print(dxclient.__version__)")
          mkdir -p dist/release
          cp dist/DXClusterClient.exe "dist/release/DXClusterClient-${VERSION}-win64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
